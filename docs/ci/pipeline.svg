<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-label="Any Ansible role goes through three steps. On a branch: quick checks, then a test in a container set up like a real server. When asking to merge: quick checks, then a test on a fresh real RHEL 9 machine that is deleted afterwards. After the merge: no testing again, the version gets a permanent tag and is ready to deploy. Any failed check stops there, and a change that fails cannot be merged." font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#24292f"/></marker>
  </defs>

  <!-- own background: the file is shown as an image, so it cannot follow GitHub's light or dark theme -->
  <rect x="0.5" y="0.5" width="999" height="429" rx="10" fill="#ffffff" stroke="#d0d7de"/>

  <!-- step panels -->
  <g fill="#f6f8fa" stroke="#d0d7de" stroke-width="1">
    <rect x="190" y="20" width="225" height="345" rx="8"/>
    <rect x="490" y="20" width="225" height="345" rx="8"/>
    <rect x="790" y="20" width="190" height="345" rx="8"/>
  </g>

  <g fill="#ffffff" stroke="#24292f" stroke-width="1.5">
    <rect x="20" y="162" width="130" height="86" rx="6"/>
    <rect x="200" y="84" width="205" height="120" rx="6"/>
    <rect x="200" y="232" width="205" height="120" rx="6"/>
    <rect x="500" y="84" width="205" height="120" rx="6"/>
    <rect x="500" y="232" width="205" height="120" rx="6" stroke-width="3"/>
    <rect x="800" y="84" width="170" height="120" rx="6"/>
    <rect x="800" y="232" width="170" height="120" rx="6"/>
  </g>

  <g fill="none" stroke="#24292f" stroke-width="1.5" marker-end="url(#a)">
    <line x1="150" y1="205" x2="188" y2="205"/>
    <line x1="302" y1="204" x2="302" y2="230"/>
    <line x1="602" y1="204" x2="602" y2="230"/>
    <line x1="885" y1="204" x2="885" y2="230"/>
    <line x1="415" y1="205" x2="488" y2="205"/>
    <line x1="715" y1="205" x2="788" y2="205"/>
  </g>

  <g fill="#24292f" text-anchor="middle">
    <text x="85" y="198" font-size="14" font-weight="600">Any Ansible role</text>
    <text x="85" y="218" font-size="11">just the role's code</text>
    <text x="85" y="234" font-size="11">the tests come to it</text>

    <text x="302" y="48" font-size="15" font-weight="600">1. Work on a branch</text>
    <text x="302" y="67" font-size="11">every time work is saved</text>
    <text x="602" y="48" font-size="15" font-weight="600">2. Ask to merge</text>
    <text x="602" y="67" font-size="11">the real test</text>
    <text x="885" y="48" font-size="15" font-weight="600">3. Merged</text>
    <text x="885" y="67" font-size="11">the release</text>

    <text x="302" y="108" font-size="13" font-weight="600">Quick checks</text>
    <text x="302" y="130" font-size="12">No passwords or keys</text>
    <text x="302" y="148" font-size="12">Files and version are valid</text>
    <text x="302" y="166" font-size="12">Ansible is well written</text>
    <text x="302" y="184" font-size="12">Settings are safe</text>

    <text x="302" y="256" font-size="13" font-weight="600">Test in a container</text>
    <text x="302" y="280" font-size="12">Set up like a real server</text>
    <text x="302" y="298" font-size="12">Does the role run?</text>
    <text x="302" y="316" font-size="12">Run it again: nothing changes</text>

    <text x="602" y="108" font-size="13" font-weight="600">Quick checks</text>
    <text x="602" y="130" font-size="12">No passwords or keys</text>
    <text x="602" y="148" font-size="12">Files and version are valid</text>
    <text x="602" y="166" font-size="12">Ansible is well written</text>
    <text x="602" y="184" font-size="12">Settings are safe</text>

    <text x="602" y="256" font-size="13" font-weight="600">Test on a real VM</text>
    <text x="602" y="278" font-size="12">Fresh RHEL 9 for each test</text>
    <text x="602" y="296" font-size="12">Security and firewall on</text>
    <text x="602" y="314" font-size="12">Does the role run? Run it again</text>
    <text x="602" y="332" font-size="12">VM is deleted afterwards</text>

    <text x="885" y="108" font-size="13" font-weight="600">No testing again</text>
    <text x="885" y="134" font-size="12">This exact code</text>
    <text x="885" y="152" font-size="12">already passed</text>
    <text x="885" y="170" font-size="12">in step 2</text>

    <text x="885" y="256" font-size="13" font-weight="600">Release</text>
    <text x="885" y="280" font-size="12">New version gets a tag</text>
    <text x="885" y="298" font-size="12">The tag never changes</text>
    <text x="885" y="316" font-size="12">Ready to deploy</text>
  </g>

  <g font-size="12" fill="#57606a" text-anchor="middle">
    <text x="452" y="197">all good</text>
    <text x="752" y="197">all good</text>
  </g>

  <text x="452" y="402" font-size="13" font-weight="600" fill="#cf222e" text-anchor="middle">Any failed check stops right there. A change that fails cannot be merged.</text>
</svg>
