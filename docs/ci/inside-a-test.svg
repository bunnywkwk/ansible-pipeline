<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-label="Inside a test, six steps. The container test and the VM test differ only in steps 1 and 3. Step 1 makes the machine: Podman starts a container, or Terraform makes a VM from the golden image. Step 2 registers it with Red Hat so packages can install. Step 3 sets the container up like a real server; the VM already is one. Step 4 runs your play with your settings. Step 5 runs the same play again and it must change nothing. Step 6 unregisters and deletes the machine, also after a failure." font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#24292f"/></marker>
  </defs>

  <!-- own background: the file is shown as an image, so it cannot follow GitHub's light or dark theme -->
  <rect x="0.5" y="0.5" width="999" height="379" rx="10" fill="#ffffff" stroke="#d0d7de"/>

  <!-- steps 1 and 3: one box per test; steps 2, 4, 5, 6: one tall box, the same for both -->
  <g fill="#ffffff" stroke="#24292f" stroke-width="1.5">
    <rect x="20" y="70" width="140" height="105" rx="6"/>
    <rect x="20" y="200" width="140" height="105" rx="6"/>
    <rect x="186" y="70" width="140" height="235" rx="6"/>
    <rect x="352" y="70" width="140" height="105" rx="6"/>
    <rect x="352" y="200" width="140" height="105" rx="6" stroke-dasharray="5 4"/>
    <rect x="518" y="70" width="140" height="235" rx="6"/>
    <rect x="684" y="70" width="140" height="235" rx="6" stroke-width="3"/>
    <rect x="850" y="70" width="130" height="235" rx="6"/>
  </g>

  <g fill="none" stroke="#24292f" stroke-width="1.5" marker-end="url(#a)">
    <line x1="160" y1="122" x2="184" y2="122"/>
    <line x1="160" y1="252" x2="184" y2="252"/>
    <line x1="326" y1="122" x2="350" y2="122"/>
    <line x1="326" y1="252" x2="350" y2="252"/>
    <line x1="492" y1="122" x2="516" y2="122"/>
    <line x1="492" y1="252" x2="516" y2="252"/>
    <line x1="658" y1="187" x2="682" y2="187"/>
    <line x1="824" y1="187" x2="848" y2="187"/>
  </g>

  <g fill="#24292f" text-anchor="middle">
    <text x="90" y="48" font-size="14" font-weight="600">1. Make it</text>
    <text x="256" y="48" font-size="14" font-weight="600">2. Register</text>
    <text x="422" y="48" font-size="14" font-weight="600">3. Set up</text>
    <text x="588" y="48" font-size="14" font-weight="600">4. Run the role</text>
    <text x="754" y="48" font-size="14" font-weight="600">5. Run it again</text>
    <text x="915" y="48" font-size="14" font-weight="600">6. Clean up</text>

    <text x="90" y="100" font-size="13" font-weight="600">Container</text>
    <text x="90" y="122" font-size="12">Branch push</text>
    <text x="90" y="142" font-size="12">Podman starts it</text>
    <text x="90" y="160" font-size="12">from ubi9-init</text>

    <text x="90" y="230" font-size="13" font-weight="600">VM</text>
    <text x="90" y="252" font-size="12">Pull request</text>
    <text x="90" y="272" font-size="12">Terraform makes it</text>
    <text x="90" y="290" font-size="12">from golden image</text>

    <text x="256" y="160" font-size="12">With Red Hat,</text>
    <text x="256" y="180" font-size="12">so packages</text>
    <text x="256" y="200" font-size="12">can install</text>
    <text x="256" y="226" font-size="11" fill="#57606a">key stays hidden</text>

    <text x="422" y="100" font-size="12">Firewall, login</text>
    <text x="422" y="120" font-size="12">service, packages:</text>
    <text x="422" y="140" font-size="12">like a real server</text>

    <text x="422" y="235" font-size="12">Nothing to do:</text>
    <text x="422" y="255" font-size="12">it already is</text>
    <text x="422" y="275" font-size="12">a real server</text>

    <text x="588" y="150" font-size="12">Your play</text>
    <text x="588" y="170" font-size="12">(ci/site.yml)</text>
    <text x="588" y="190" font-size="12">or the default,</text>
    <text x="588" y="210" font-size="12">with your settings</text>
    <text x="588" y="230" font-size="12">(ci/group_vars)</text>

    <text x="754" y="160" font-size="12">Same play</text>
    <text x="754" y="180" font-size="12">once more</text>
    <text x="754" y="206" font-size="13" font-weight="600">Must change</text>
    <text x="754" y="224" font-size="13" font-weight="600">nothing</text>

    <text x="915" y="170" font-size="12">Unregister</text>
    <text x="915" y="190" font-size="12">and delete</text>
    <text x="915" y="216" font-size="11" fill="#57606a">also after a fail</text>
  </g>

  <text x="500" y="336" font-size="12" fill="#57606a" text-anchor="middle">Tall boxes are the same files for both tests. Only steps 1 and 3 differ.</text>
  <text x="500" y="362" font-size="13" font-weight="600" fill="#cf222e" text-anchor="middle">Any step fails: the build is red, and step 6 still runs.</text>
</svg>
