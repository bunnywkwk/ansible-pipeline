<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-label="Inside a test, five steps. The container test and the VM test differ only in steps 1 and 2. Step 1 makes the machine: Podman starts a Rocky Linux 9 container, or Terraform makes a VM from the RHEL 9 golden image. Step 2 sets it up: the container gets the RHEL 9 minimal install and starts the firewall and login service; the VM registers with Red Hat for packages. Step 3 runs your play with your settings. Step 4 runs the same play again and it must change nothing. Step 5 deletes the machine, also after a failure." font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#24292f"/></marker>
  </defs>

  <!-- own background: the file is shown as an image, so it cannot follow GitHub's light or dark theme -->
  <rect x="0.5" y="0.5" width="999" height="379" rx="10" fill="#ffffff" stroke="#d0d7de"/>

  <!-- steps 1 and 2: one box per test; steps 3, 4, 5: one tall box, the same for both -->
  <g fill="#ffffff" stroke="#24292f" stroke-width="1.5">
    <rect x="20" y="70" width="170" height="105" rx="6"/>
    <rect x="20" y="200" width="170" height="105" rx="6"/>
    <rect x="220" y="70" width="170" height="105" rx="6"/>
    <rect x="220" y="200" width="170" height="105" rx="6"/>
    <rect x="420" y="70" width="170" height="235" rx="6"/>
    <rect x="620" y="70" width="170" height="235" rx="6" stroke-width="3"/>
    <rect x="820" y="70" width="160" height="235" rx="6"/>
  </g>

  <g fill="none" stroke="#24292f" stroke-width="1.5" marker-end="url(#a)">
    <line x1="190" y1="122" x2="218" y2="122"/>
    <line x1="190" y1="252" x2="218" y2="252"/>
    <line x1="390" y1="122" x2="418" y2="122"/>
    <line x1="390" y1="252" x2="418" y2="252"/>
    <line x1="590" y1="187" x2="618" y2="187"/>
    <line x1="790" y1="187" x2="818" y2="187"/>
  </g>

  <g fill="#24292f" text-anchor="middle">
    <text x="105" y="48" font-size="14" font-weight="600">1. Make it</text>
    <text x="305" y="48" font-size="14" font-weight="600">2. Set up</text>
    <text x="505" y="48" font-size="14" font-weight="600">3. Run the role</text>
    <text x="705" y="48" font-size="14" font-weight="600">4. Run it again</text>
    <text x="900" y="48" font-size="14" font-weight="600">5. Clean up</text>

    <text x="105" y="100" font-size="13" font-weight="600">Container</text>
    <text x="105" y="122" font-size="12">Branch push</text>
    <text x="105" y="142" font-size="12">Podman starts it</text>
    <text x="105" y="160" font-size="12">from Rocky Linux 9</text>

    <text x="105" y="230" font-size="13" font-weight="600">VM</text>
    <text x="105" y="252" font-size="12">Pull request</text>
    <text x="105" y="272" font-size="12">Terraform makes it</text>
    <text x="105" y="290" font-size="12">from golden image</text>

    <text x="305" y="104" font-size="12">RHEL 9 minimal install,</text>
    <text x="305" y="124" font-size="12">firewall and login</text>
    <text x="305" y="144" font-size="12">service on, like the VM</text>

    <text x="305" y="234" font-size="12">Register with</text>
    <text x="305" y="254" font-size="12">Red Hat, so</text>
    <text x="305" y="274" font-size="12">packages can install</text>

    <text x="505" y="150" font-size="12">Your play</text>
    <text x="505" y="170" font-size="12">(ci/site.yml)</text>
    <text x="505" y="190" font-size="12">or the default,</text>
    <text x="505" y="210" font-size="12">with your settings</text>
    <text x="505" y="230" font-size="12">(ci/group_vars)</text>

    <text x="705" y="160" font-size="12">Same play</text>
    <text x="705" y="180" font-size="12">once more</text>
    <text x="705" y="206" font-size="13" font-weight="600">Must change</text>
    <text x="705" y="224" font-size="13" font-weight="600">nothing</text>

    <text x="900" y="170" font-size="12">Delete it</text>
    <text x="900" y="190" font-size="12">(VM: unregister first)</text>
    <text x="900" y="216" font-size="11" fill="#57606a">also after a fail</text>
  </g>

  <text x="500" y="336" font-size="12" fill="#57606a" text-anchor="middle">Tall boxes are the same files for both tests. Only steps 1 and 2 differ.</text>
  <text x="500" y="362" font-size="13" font-weight="600" fill="#cf222e" text-anchor="middle">Any step fails: the build is red, and step 5 still runs.</text>
</svg>
