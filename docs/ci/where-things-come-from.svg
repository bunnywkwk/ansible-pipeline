<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-label="Two repos meet in Jenkins. Your role repo gives the role's code and, if you want, its own play and settings in a ci folder. The ansible-pipeline repo gives the recipe and the tests, the same for every role. Jenkins joins them on every push: a branch is tested in a container, a pull request on a fresh real RHEL 9 VM. The result shows as a tick or a cross on GitHub." font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#24292f"/></marker>
  </defs>

  <!-- own background: the file is shown as an image, so it cannot follow GitHub's light or dark theme -->
  <rect x="0.5" y="0.5" width="999" height="399" rx="10" fill="#ffffff" stroke="#d0d7de"/>

  <g fill="#ffffff" stroke="#24292f" stroke-width="1.5">
    <rect x="20" y="30" width="250" height="140" rx="6"/>
    <rect x="20" y="210" width="250" height="140" rx="6"/>
    <rect x="390" y="120" width="220" height="140" rx="6"/>
    <rect x="730" y="30" width="250" height="140" rx="6"/>
    <rect x="730" y="210" width="250" height="140" rx="6" stroke-width="3"/>
  </g>

  <g fill="none" stroke="#24292f" stroke-width="1.5" marker-end="url(#a)">
    <line x1="270" y1="100" x2="388" y2="160"/>
    <line x1="270" y1="280" x2="388" y2="220"/>
    <line x1="610" y1="160" x2="728" y2="100"/>
    <line x1="610" y1="220" x2="728" y2="280"/>
  </g>

  <g fill="#24292f" text-anchor="middle">
    <text x="145" y="62" font-size="15" font-weight="600">Your role repo</text>
    <text x="145" y="90" font-size="12">The role's code</text>
    <text x="145" y="112" font-size="12">Optional ci/ folder:</text>
    <text x="145" y="130" font-size="12">your own play and settings</text>
    <text x="145" y="152" font-size="11" fill="#57606a">nothing about the pipeline</text>

    <text x="145" y="242" font-size="15" font-weight="600">ansible-pipeline</text>
    <text x="145" y="270" font-size="12">The recipe (Jenkinsfile)</text>
    <text x="145" y="290" font-size="12">The tests</text>
    <text x="145" y="312" font-size="12">One copy for every role</text>

    <text x="500" y="152" font-size="15" font-weight="600">Jenkins</text>
    <text x="500" y="180" font-size="12">On every push or pull request</text>
    <text x="500" y="200" font-size="12">joins the two</text>
    <text x="500" y="220" font-size="12">and runs the steps</text>

    <text x="855" y="62" font-size="15" font-weight="600">Container</text>
    <text x="855" y="90" font-size="12">Push to a branch</text>
    <text x="855" y="110" font-size="12">Quick, on every save</text>
    <text x="855" y="130" font-size="12">Set up like a real server</text>

    <text x="855" y="242" font-size="15" font-weight="600">Real VM</text>
    <text x="855" y="270" font-size="12">Pull request</text>
    <text x="855" y="290" font-size="12">Fresh RHEL 9 each time</text>
    <text x="855" y="310" font-size="12">Deleted afterwards</text>
  </g>

  <g font-size="12" fill="#57606a" text-anchor="middle">
    <text x="330" y="92">code + settings</text>
    <text x="330" y="302">recipe + tests</text>
    <text x="660" y="100">branch</text>
    <text x="660" y="292">pull request</text>
  </g>

  <text x="500" y="384" font-size="13" font-weight="600" fill="#cf222e" text-anchor="middle">The result shows on GitHub as a tick or a cross. A cross on a pull request blocks the merge.</text>
</svg>
