---
# Removes the test VM with Terraform. Unregistering is shared/unregister.yml (cleanup), which molecule
# runs before every destroy. Also runs before create, with nothing to remove.
- name: Destroy | Remove the VM
  hosts: localhost
  gather_facts: false
  vars:
    destroy_tf_dir: "{{ molecule_scenario_directory }}/terraform"
  tasks:
    - name: Destroy | Terraform init
      ansible.builtin.command:
        argv: [terraform, "-chdir={{ destroy_tf_dir }}", init, -input=false, -no-color]
      changed_when: false

    - name: Destroy | Terraform destroy
      ansible.builtin.command:
        argv:
          - terraform
          - -chdir={{ destroy_tf_dir }}
          - destroy
          - -input=false
          - -auto-approve
          - -no-color
          - -var=run_id={{ molecule_yml.platforms[0].name }}
      register: destroy_tf
      changed_when: "'Destroy complete! Resources: 0 destroyed' not in destroy_tf.stdout"

    - name: Destroy | Empty the instance config
      ansible.builtin.copy:
        content: "{{ [] | to_yaml }}"
        dest: "{{ molecule_instance_config }}"
        mode: "0600"
