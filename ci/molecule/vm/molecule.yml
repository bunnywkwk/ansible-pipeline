---
# Pull request test on a real RHEL 9 VM: firewalld on, SELinux enforcing, packages from Red Hat.
# Kept here, not in role repos: the pipeline copies it to molecule/vm in PR builds.
# Runs the role with its own defaults; proves it runs and is idempotent on a real host.
driver:
  name: default
  options:
    managed: true
platforms:
  - name: "role-vm-${MOLECULE_RUN_ID:-local}"
provisioner:
  name: ansible
  playbooks:
    create: create.yml
    destroy: destroy.yml
    converge: ../default/converge.yml
scenario:
  # No dependency step: the prerun installs the role's collections, and this driver needs none.
  test_sequence:
    - destroy
    - create
    - converge
    - idempotence
    - destroy
