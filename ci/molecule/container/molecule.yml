---
# Container test for branch builds. Kept here, not in role repos: the pipeline
# copies this folder to molecule/ in the build, over anything the role has.
# Proves the role runs and is idempotent; checking what it does is out of scope.
driver:
  name: podman
platforms:
  - name: role-el9-${MOLECULE_RUN_ID:-local}
    # Rocky Linux 9 (a RHEL 9 rebuild, as in ansible-lockdown's scenario): its
    # public repos have every RHEL 9 package, so no Red Hat registration. Quay,
    # not Docker Hub: no pull limit.
    image: quay.io/rockylinux/rockylinux:9-ubi-init
    # The role's ci/group_vars/container.yml applies to this group only.
    groups: [container]
    pre_build_image: true
    command: /usr/sbin/init
    # Mounts /run, /tmp and a writable /sys/fs/cgroup:
    # lockdown's extra Docker lines are not needed here.
    systemd: always
    # All capabilities inside the container, as in ansible-lockdown's
    # scenario, so logind and firewalld can start. Rootless: the
    # container gets no more than the jenkins user has on the host.
    privileged: true
provisioner:
  name: ansible
  playbooks:
    # Shared with the VM test; prepare.yml makes the OS the same as the VM.
    converge: ../shared/site.yml
scenario:
  test_sequence:
    # Installs the podman driver's own collection on a clean node.
    - dependency
    - destroy
    - create
    - prepare
    - converge
    - idempotence
    - destroy
