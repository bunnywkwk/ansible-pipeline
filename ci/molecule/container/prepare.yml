---
# Container test, before converge (like ansible-lockdown's prepare.yml):
# make the container the same OS as the VM, for any role.
- name: Make the container look like the VM
  hosts: all
  gather_facts: false
  tasks:
    # The golden image kickstart installs @^minimal-environment, which is the
    # core group. Firmware and microcode are for real hardware: the container
    # runs on the host's kernel.
    - name: Prepare | Install the RHEL 9 minimal install (group core)
      ansible.builtin.dnf:
        name: "@core"
        exclude:
          - "*-firmware"
          - microcode_ctl
        state: present

    - name: Prepare | Start firewalld, as on the VM
      ansible.builtin.systemd_service:
        name: firewalld
        state: started
        enabled: true

    # The image masks logind; a VM runs it (loginctl, user sessions).
    - name: Prepare | Start systemd-logind, as on the VM
      ansible.builtin.systemd_service:
        name: systemd-logind
        masked: false
        state: started
