---
# ROLE_FQCN is replaced by the pipeline with <namespace>.<role_name> from the
# role's meta/main.yml. Static import, so ansible-lint also reads its tasks.
- name: Converge
  hosts: all
  gather_facts: false
  tasks:
    - name: Run the role from this checkout
      ansible.builtin.import_role:
        name: ROLE_FQCN
